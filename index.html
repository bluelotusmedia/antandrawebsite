<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antandra | Coming Soon</title>
    <meta name="description" content="The official website for Antandra. Psychedelic bass music, new releases, and cosmic frequencies coming soon.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Lush Green & Deep Jungle Color Palette */
            --color-bg: #020a04;
            --color-lush-green: #00ff55;
            --color-deep-green: #00882b;
            --color-green-glow: rgba(0, 255, 85, 0.6);
            --color-ambient-glow: rgba(0, 136, 43, 0.4);
            --color-text-main: #e0f2e5;
            --color-text-muted: #8fb39a;
            
            /* Typography */
            --font-display: 'Michroma', sans-serif;
            --font-body: 'Rajdhani', sans-serif;
            
            /* Spacing & Layout */
            --spacing-sm: 0.5rem;
            --spacing-md: 1rem;
            --spacing-lg: 2rem;
            --spacing-xl: 4rem;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text-main);
            font-family: var(--font-body);
            font-size: 18px;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at center, #041407 0%, #020a04 100%);
        }

        /* Base ambient lighting */
        .ambient-bg__glow {
            position: absolute;
            width: 150vw;
            height: 150vh;
            top: -25vh;
            left: -25vw;
            background-image: 
                radial-gradient(circle at 30% 70%, var(--color-ambient-glow) 0%, transparent 50%),
                radial-gradient(circle at 70% 30%, var(--color-green-glow) 0%, transparent 40%);
            filter: blur(120px);
            opacity: 0.5;
            animation: glow-shift 15s ease-in-out infinite alternate;
        }

        #psy-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; /* Sits above the gradient background, below the content */
            opacity: 0.7;
        }

        @keyframes glow-shift {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.2) translate(-2%, 2%); }
        }

        .page-container {
            width: 100%;
            max-width: 800px;
            padding: var(--spacing-xl) var(--spacing-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 10;
        }

        .header {
            margin-bottom: var(--spacing-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-container {
            width: 100%;
            max-width: 450px;
            margin-bottom: var(--spacing-md);
        }

        .logo-svg {
            width: 100%;
            height: auto;
            overflow: visible;
        }

        .logo-svg .glow-effect {
            filter: drop-shadow(0px 0px 8px var(--color-lush-green));
            animation: svg-pulse 3s infinite alternate;
        }

        @keyframes svg-pulse {
            0% { filter: drop-shadow(0px 0px 5px var(--color-lush-green)) drop-shadow(0px 0px 15px var(--color-deep-green)); }
            100% { filter: drop-shadow(0px 0px 2px var(--color-lush-green)) drop-shadow(0px 0px 8px var(--color-deep-green)); }
        }

        .subtitle {
            font-family: var(--font-body);
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            font-weight: 500;
            color: var(--color-lush-green);
            letter-spacing: 0.4em;
            text-transform: uppercase;
            margin-bottom: var(--spacing-xl);
            text-shadow: 0 0 10px rgba(0, 255, 85, 0.4);
        }

        .footer {
            margin-top: auto;
            width: 100%;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: var(--spacing-lg);
            list-style: none;
            flex-wrap: wrap;
        }

        .social-links__item {
            display: inline-block;
        }

        .social-links__link {
            color: var(--color-text-muted);
            text-decoration: none;
            font-family: var(--font-display);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            transition: all 0.3s ease;
            position: relative;
            padding-bottom: 5px;
        }

        .social-links__link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: var(--color-lush-green);
            transform: scaleX(0);
            transition: transform 0.3s cubic-bezier(0.86, 0, 0.07, 1);
            transform-origin: right;
        }

        .social-links__link:hover {
            color: var(--color-lush-green);
            text-shadow: 0 0 8px rgba(0, 255, 85, 0.6);
        }

        .social-links__link:hover::after {
            transform: scaleX(1);
            transform-origin: left;
        }
    </style>
</head>
<body>

    <!-- Ambient Geometric Background Elements -->
    <div class="ambient-bg" aria-hidden="true">
        <div class="ambient-bg__glow"></div>
        <canvas id="psy-canvas"></canvas>
    </div>

    <!-- Main Page Content -->
    <main class="page-container">
        
        <header class="header">
            <!-- Custom SVG Recreated Logo -->
            <div class="logo-container">
                <svg class="logo-svg" viewBox="0 0 500 160" xmlns="http://www.w3.org/2000/svg">
                    <g class="glow-effect">
                        <!-- Geometric Valknut Emblem -->
                        <g stroke="var(--color-lush-green)" stroke-width="2.5" stroke-linejoin="round" fill="none" transform="translate(250, 35)">
                            <!-- Top Triangle -->
                            <polygon points="0,-30 -26,15 26,15" />
                            <!-- Bottom Right Triangle -->
                            <polygon points="15,-4 -11,41 41,41" />
                            <!-- Bottom Left Triangle -->
                            <polygon points="-15,-4 -41,41 11,41" />
                        </g>
                        <!-- Stylized Antandra Typography -->
                        <text x="50%" y="130" text-anchor="middle" font-family="'Michroma', sans-serif" font-size="44" fill="#ffffff" letter-spacing="12">ANTANDRA</text>
                    </g>
                </svg>
            </div>
            <h2 class="subtitle">Coming Soon</h2>
        </header>

        <footer class="footer">
            <ul class="social-links">
                <li class="social-links__item">
                    <a href="https://soundcloud.com/antandra" target="_blank" rel="noopener noreferrer" class="social-links__link">SoundCloud</a>
                </li>
                <li class="social-links__item">
                    <a href="https://antandra.bandcamp.com/" target="_blank" rel="noopener noreferrer" class="social-links__link">Bandcamp</a>
                </li>
                <li class="social-links__item">
                    <a href="https://youtube.com/@antandramusic" target="_blank" rel="noopener noreferrer" class="social-links__link">YouTube</a>
                </li>
            </ul>
        </footer>

    </main>

    <!-- Native Canvas Animation Logic -->
    <script>
        const canvas = document.getElementById('psy-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class MorphingTriangle {
            constructor() {
                // Randomize position across the screen
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                
                // Variable sizes for depth perception
                this.baseSize = Math.random() * 120 + 30; 
                
                // Slow, abstract drifting speed
                this.vx = (Math.random() - 0.5) * 0.4;
                this.vy = (Math.random() - 0.5) * 0.4;
                
                // Rotation
                this.angle = Math.random() * Math.PI * 2;
                this.vAngle = (Math.random() - 0.5) * 0.005;
                
                // Morphing Engine: Each vertex gets its own phase offset and speed
                this.phase1 = Math.random() * Math.PI * 2;
                this.phase2 = Math.random() * Math.PI * 2;
                this.phase3 = Math.random() * Math.PI * 2;
                this.morphSpeed = Math.random() * 0.001 + 0.0005;
                
                // Aesthetics
                const opacity = Math.random() * 0.15 + 0.02; 
                this.color = `rgba(0, 255, 85, ${opacity})`;
                this.lineWidth = Math.random() * 1.5 + 0.5;
            }

            update() {
                // Position update
                this.x += this.vx;
                this.y += this.vy;
                this.angle += this.vAngle;

                // Seamless toroidal wrapping (wrap around edges so it never ends)
                const bound = this.baseSize * 1.5;
                if (this.x < -bound) this.x = width + bound;
                if (this.x > width + bound) this.x = -bound;
                if (this.y < -bound) this.y = height + bound;
                if (this.y > height + bound) this.y = -bound;
            }

            draw(ctx, time) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // Morphing calculation: Allow vertices to stretch up to 40% of base size
                const morphIntensity = this.baseSize * 0.4; 
                const t = time * this.morphSpeed;
                
                // Calculate dynamic vertex offsets
                const dx1 = Math.sin(t + this.phase1) * morphIntensity;
                const dy1 = Math.cos(t + this.phase1) * morphIntensity;
                
                const dx2 = Math.sin(t + this.phase2) * morphIntensity;
                const dy2 = Math.cos(t + this.phase2) * morphIntensity;
                
                const dx3 = Math.sin(t + this.phase3) * morphIntensity;
                const dy3 = Math.cos(t + this.phase3) * morphIntensity;

                // Draw the deformed geometric shape
                ctx.beginPath();
                ctx.moveTo(0 + dx1, -this.baseSize + dy1); // Top
                ctx.lineTo(this.baseSize * 0.866 + dx2, this.baseSize * 0.5 + dy2); // Bottom Right
                ctx.lineTo(-this.baseSize * 0.866 + dx3, this.baseSize * 0.5 + dy3); // Bottom Left
                ctx.closePath();

                // Apply styling
                ctx.strokeStyle = this.color;
                ctx.lineWidth = this.lineWidth;
                ctx.stroke();

                // Add an extremely faint fill to the larger triangles for a glowing overlap effect
                if (this.baseSize > 80) {
                    ctx.fillStyle = this.color.replace(/[\d\.]+\)$/g, '0.01)');
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        // Initialize 45 entities (Keeps M1 CPU overhead virtually zero while filling the screen)
        const entities = Array.from({ length: 45 }, () => new MorphingTriangle());

        function animate(time) {
            ctx.clearRect(0, 0, width, height);
            
            // Screen blending mode gives the overlapping strokes a biological, glowing edge
            ctx.globalCompositeOperation = 'screen';
            
            entities.forEach(entity => {
                entity.update();
                entity.draw(ctx, time);
            });

            requestAnimationFrame(animate);
        }

        // Kick off the loop
        requestAnimationFrame(animate);
    </script>
</body>
</html>
