<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antandra | Coming Soon</title>
    <meta name="description" content="The official website for Antandra. Psychedelic bass music, new releases, and cosmic frequencies coming soon.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Lush Green & Deep Jungle Color Palette */
            --color-bg: #020a04;
            --color-lush-green: #00ff55;
            --color-deep-green: #00882b;
            --color-green-glow: rgba(0, 255, 85, 0.6);
            --color-ambient-glow: rgba(0, 136, 43, 0.4);
            --color-text-main: #e0f2e5;
            --color-text-muted: #8fb39a;
            
            /* Typography */
            --font-display: 'Michroma', sans-serif;
            --font-body: 'Rajdhani', sans-serif;
            
            /* Spacing & Layout */
            --spacing-sm: 0.5rem;
            --spacing-md: 1rem;
            --spacing-lg: 2rem;
            --spacing-xl: 4rem;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text-main);
            font-family: var(--font-body);
            font-size: 18px;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at center, #041407 0%, #020a04 100%);
        }

        /* Ambient Lighting from the bio PDF vibe */
        .ambient-bg__glow {
            position: absolute;
            width: 150vw;
            height: 150vh;
            top: -25vh;
            left: -25vw;
            background-image: 
                radial-gradient(circle at 30% 70%, var(--color-ambient-glow) 0%, transparent 50%),
                radial-gradient(circle at 70% 30%, var(--color-green-glow) 0%, transparent 40%);
            filter: blur(120px);
            opacity: 0.5;
            animation: glow-shift 15s ease-in-out infinite alternate;
        }

        /* Animated Geometric Triangles */
        .ambient-bg__triangles-layer-1 {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M40 10l30 52H10z' fill='none' stroke='rgba(0, 255, 85, 0.05)' stroke-width='1'/%3E%3C/svg%3E");
            animation: drift-slow 40s linear infinite;
        }

        .ambient-bg__triangles-layer-2 {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M60 20l40 69H20z' fill='rgba(0, 255, 85, 0.02)' stroke='rgba(0, 255, 85, 0.08)' stroke-width='1'/%3E%3C/svg%3E");
            animation: drift-fast 25s linear infinite reverse;
        }

        @keyframes glow-shift {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.2) translate(-2%, 2%); }
        }

        @keyframes drift-slow {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(80px) rotate(5deg); }
        }

        @keyframes drift-fast {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(120px) rotate(-3deg); }
        }

        .page-container {
            width: 100%;
            max-width: 800px;
            padding: var(--spacing-xl) var(--spacing-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 1;
        }

        .header {
            margin-bottom: var(--spacing-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-container {
            width: 100%;
            max-width: 450px;
            margin-bottom: var(--spacing-md);
        }

        .logo-svg {
            width: 100%;
            height: auto;
            overflow: visible;
        }

        .logo-svg .glow-effect {
            filter: drop-shadow(0px 0px 8px var(--color-lush-green));
            animation: svg-pulse 3s infinite alternate;
        }

        @keyframes svg-pulse {
            0% { filter: drop-shadow(0px 0px 5px var(--color-lush-green)) drop-shadow(0px 0px 15px var(--color-deep-green)); }
            100% { filter: drop-shadow(0px 0px 2px var(--color-lush-green)) drop-shadow(0px 0px 8px var(--color-deep-green)); }
        }

        .subtitle {
            font-family: var(--font-body);
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            font-weight: 500;
            color: var(--color-lush-green);
            letter-spacing: 0.4em;
            text-transform: uppercase;
            margin-bottom: var(--spacing-xl);
            text-shadow: 0 0 10px rgba(0, 255, 85, 0.4);
        }

        .footer {
            margin-top: auto;
            width: 100%;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: var(--spacing-lg);
            list-style: none;
            flex-wrap: wrap;
        }

        .social-links__item {
            display: inline-block;
        }

        .social-links__link {
            color: var(--color-text-muted);
            text-decoration: none;
            font-family: var(--font-display);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            transition: all 0.3s ease;
            position: relative;
            padding-bottom: 5px;
        }

        .social-links__link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: var(--color-lush-green);
            transform: scaleX(0);
            transition: transform 0.3s cubic-bezier(0.86, 0, 0.07, 1);
            transform-origin: right;
        }

        .social-links__link:hover {
            color: var(--color-lush-green);
            text-shadow: 0 0 8px rgba(0, 255, 85, 0.6);
        }

        .social-links__link:hover::after {
            transform: scaleX(1);
            transform-origin: left;
        }
    </style>
</head>
<body>

    <!-- Ambient Geometric Background Elements -->
    <div class="ambient-bg" aria-hidden="true">
        <div class="ambient-bg__glow"></div>
        <div class="ambient-bg__triangles-layer-1"></div>
        <div class="ambient-bg__triangles-layer-2"></div>
    </div>

    <!-- Main Page Content -->
    <main class="page-container">
        
        <header class="header">
            <!-- Custom SVG Recreated Logo -->
            <div class="logo-container">
                <svg class="logo-svg" viewBox="0 0 500 160" xmlns="http://www.w3.org/2000/svg">
                    <g class="glow-effect">
                        <!-- Interlocking Geometric Merkaba/Triangle Emblem -->
                        <g stroke="var(--color-lush-green)" stroke-width="2" fill="none" transform="translate(250, 45)">
                            <polygon points="0,-30 26,15 -26,15" />
                            <polygon points="0,30 26,-15 -26,-15" />
                            <circle cx="0" cy="0" r="8" fill="var(--color-bg)" stroke="var(--color-lush-green)"/>
                        </g>
                        <!-- Stylized Antandra Typography -->
                        <text x="50%" y="130" text-anchor="middle" font-family="'Michroma', sans-serif" font-size="44" fill="#ffffff" letter-spacing="12">ANTANDRA</text>
                    </g>
                </svg>
            </div>
            <h2 class="subtitle">Coming Soon</h2>
        </header>

        <footer class="footer">
            <ul class="social-links">
                <li class="social-links__item">
                    <a href="https://soundcloud.com/antandra" target="_blank" rel="noopener noreferrer" class="social-links__link">SoundCloud</a>
                </li>
                <li class="social-links__item">
                    <a href="https://antandra.bandcamp.com/" target="_blank" rel="noopener noreferrer" class="social-links__link">Bandcamp</a>
                </li>
                <li class="social-links__item">
                    <a href="https://youtube.com/@antandramusic" target="_blank" rel="noopener noreferrer" class="social-links__link">YouTube</a>
                </li>
            </ul>
        </footer>

    </main>

</body>
</html>
